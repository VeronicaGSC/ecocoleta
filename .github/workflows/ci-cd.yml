# =====================================================================
# Pipeline CI/CD — EcoColeta API
#   1. Build + testes automatizados (xUnit)
#   2. Build e push da imagem Docker (GitHub Container Registry)
#   3. Deploy automático em STAGING (Azure App Service) + smoke test
#   4. Deploy em PRODUÇÃO (Azure App Service) após aprovação manual + smoke test
# =====================================================================
name: CI/CD - EcoColeta

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  # ---------------------------------------------------------------
  build-test:
    name: 1. Build e Testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurar dependências
        run: dotnet restore EcoColeta.sln

      - name: Build (Release)
        run: dotnet build EcoColeta.sln -c Release --no-restore

      - name: Executar testes automatizados
        run: >
          dotnet test EcoColeta.sln -c Release --no-build --verbosity normal
          --logger "trx;LogFileName=resultados.trx"
          --results-directory ./TestResults

      - name: Publicar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-testes
          path: ./TestResults

  # ---------------------------------------------------------------
  docker:
    name: 2. Build e Push da Imagem Docker
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Definir nome da imagem
        id: vars
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/ecocoleta-api:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/${OWNER}/ecocoleta-api:latest" >> "$GITHUB_OUTPUT"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ steps.vars.outputs.image }}
            ${{ steps.vars.outputs.latest }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  # ---------------------------------------------------------------
  deploy-staging:
    name: 3. Deploy - Staging
    needs: docker
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Deploy no Azure App Service (staging)
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ needs.docker.outputs.image }}

      - name: Smoke test (health check + versão)
        run: bash scripts/smoke-test.sh "${{ steps.deploy.outputs.webapp-url }}" "${{ github.sha }}"

  # ---------------------------------------------------------------
  deploy-production:
    name: 4. Deploy - Produção
    needs: [docker, deploy-staging]
    runs-on: ubuntu-latest
    environment:
      name: production          # exige aprovação manual (Required reviewers)
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Deploy no Azure App Service (produção)
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ needs.docker.outputs.image }}

      - name: Smoke test (health check + versão)
        run: bash scripts/smoke-test.sh "${{ steps.deploy.outputs.webapp-url }}" "${{ github.sha }}"
