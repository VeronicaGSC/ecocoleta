# =====================================================================
# EcoColeta — orquestração local: API + MongoDB + Mongo Express
# Uso:  cp .env.example .env  &&  docker compose up -d --build
# =====================================================================
name: ecocoleta

services:
  mongodb:
    image: mongo:7.0
    container_name: ecocoleta-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongo_data:/data/db          # volume nomeado: os dados persistem entre reinicializações
    networks:
      - ecocoleta-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-local}
    image: ecocoleta-api:local
    container_name: ecocoleta-api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy   # a API só sobe quando o banco estiver pronto
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Mongo__ConnectionString: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/?authSource=admin
      Mongo__Database: ${MONGO_DATABASE}
      Seed__Enabled: "true"
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - ecocoleta-net

  mongo-express:
    image: mongo-express:1.0.2
    container_name: ecocoleta-mongo-express
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD}
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    networks:
      - ecocoleta-net

networks:
  ecocoleta-net:
    driver: bridge

volumes:
  mongo_data:
